[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merit-feddg"
version = "0.2.1"
description = "Modality-routed specialist lenses for source-only federated domain generalization in medical VLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MERIT-FedDG contributors" }]
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
research = [
  "accelerate>=0.30,<2",
  "albumentations>=1.4,<3",
  "datasets>=2.19,<5",
  "einops>=0.8,<1",
  "huggingface-hub>=0.24,<2",
  "opencv-python-headless>=4.10,<5",
  "protobuf>=4.25,<7",
  "pyarrow>=15,<24",
  "qwen-vl-utils>=0.0.8,<1",
  "safetensors>=0.4,<1",
  "scikit-learn>=1.3,<2",
  "sentencepiece>=0.2,<1",
  "timm>=1.0,<2",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "transformers>=4.49,<5",
]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
merit-feddg = "merit_feddg.cli:main"

[tool.setuptools.packages.find]
include = ["merit_feddg*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
