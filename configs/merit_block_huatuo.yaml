# Legacy HuatuoGPT-Vision receiver-only configuration for MERIT-Block.
base_config: configs/llava_med_capabilities.yaml
prompt_contract: anchor-task-v1

generalist:
  backend: huatuo_vision
  id: FreedomIntelligence/HuatuoGPT-Vision-7B
  checkpoint_path: ${HUATUO_VISION_CHECKPOINT}
  source_path: ${HUATUO_VISION_SOURCE}
  vision_tower_path: ""
  dtype: bfloat16
  device: cuda
  deterministic_image_padding: true
  training_free_spatial: true
  spatial_max_records: 64
  generation:
    repetition_penalty: 1.0
    min_new_tokens: 0

capability_value:
  generation:
    max_new_tokens: 1024
    block_tokens: 1024
    max_expert_calls: 6
    max_decisions: 6
    max_evidence_chars: 30000
    visual_views: 0
    evidence_style: semantic
    evidence_order: acquisition
    token_budgeted_evidence: true
    request_style: need
    request_scope_check: false
    retrieval_answer_context: false
    behavior_probe: "off"
    uncertainty_from_probe: false
    semantic_spatial: false
    compact_native: true
    compact_columns: true
    vector_gate: "off"
    native_entry_transport: false
    claim_attribute_filter: false
    claim_gate_max_checks: 2
    vector_gate_probe_tokens: 1024
    spatial_weighting: equal
    vector_gate_min_gain: 0.000001
