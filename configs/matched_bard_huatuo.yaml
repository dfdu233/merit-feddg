# Adaptive BARD on the legacy HuatuoGPT-Vision-7B LLaVA-Qwen2 receiver.
# Set HUATUO_VISION_CHECKPOINT and HUATUO_VISION_SOURCE explicitly on the server.
base_config: configs/llava_med_capabilities.yaml
prompt_contract: anchor-ce-v1

generalist:
  backend: huatuo_vision
  id: FreedomIntelligence/HuatuoGPT-Vision-7B
  checkpoint_path: ${HUATUO_VISION_CHECKPOINT}
  source_path: ${HUATUO_VISION_SOURCE}
  vision_tower_path: ""
  dtype: bfloat16
  device: cuda
  deterministic_image_padding: true
  training_free_spatial: true
  spatial_max_records: 64
  generation:
    repetition_penalty: 1.2
    min_new_tokens: 1

capability_value:
  generation:
    max_new_tokens: 1024
    block_tokens: 1024
    max_expert_calls: 6
    max_decisions: 6
    max_evidence_chars: 30000
    visual_views: 0
    evidence_style: semantic
    evidence_order: acquisition
    token_budgeted_evidence: true
    request_style: need
    request_scope_check: false
    retrieval_answer_context: false
    behavior_probe: "off"
    uncertainty_from_probe: false
    semantic_spatial: false
    compact_native: true
    compact_columns: true
    vector_gate: "off"
    native_entry_transport: false
    claim_attribute_filter: false
    claim_gate_max_checks: 2
    vector_gate_probe_tokens: 64
    spatial_weighting: equal
    vector_gate_min_gain: 0.000001

bard:
  fault_budget: 1
  aggregation: geometric_median
  median_iterations: 12
  median_tolerance: 0.000001
  single_expert_policy: baseline
  pair_policy: unanimous
  fault_probe_scale: 8.0

expert_overrides:
  cxr_findings:
    spatial_support: true
