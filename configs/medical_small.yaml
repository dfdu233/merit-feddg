seed: 42
generalist:
  id: OpenMed/Qwen2.5-3B-MedVL
  adapter: qwen_layer_probe
  dtype: bfloat16
  device_map: auto
  layers: [4, 8, 12, 16, 20, 24, -1]
router:
  id: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
  adapter: biomedclip_router
  abstain_entropy: 0.95
broad_specialist:
  id: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
  adapter: contrastive_biomedclip
experts:
  cxr:
    id: StanfordAIMI/CheXagent-2-3b
    adapter: generative_chexagent
    capabilities: [classification, generation]
  pathology:
    id: MahmoodLab/CONCH
    adapter: contrastive_conch
    capabilities: [classification, retrieval]
  oct:
    id: QIAIUNCC/LO-VLM
    adapter: generative_blip
    capabilities: [classification, generation]
method:
  correction_strength: 0.8
  agreement_temperature: 0.15
  erasure_floor: 0.05
  max_correction_norm: 1.25
  reliability_prior: 4.0
  reliability_lcb_z: 1.0
med_defer:
  granularity: clinical_claim
  execution: sparse
  trigger: uncertainty_or_claim_boundary
  controller:
    uncertainty_threshold: 0.35
    minimum_utility: 0.08
    cost_weight: 0.05
  domain_trust:
    source_statistic: federated_lower_confidence_bound
    aggregation: lower_tail_cvar
    cvar_alpha: 0.25
    ood_temperature: 2.0
    minimum_post_call_trust: 0.05
  guidance:
    representation: concept_phrase_token_bias
    strength: 0.8
    max_bias_norm: 1.25
protocol:
  source_only: true
  split: leave_one_domain_out
  target_labels_visible_during_fit: false
  cache_evidence: true
