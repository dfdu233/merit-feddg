seed: 42
generalist:
  id: Qwen/Qwen2.5-VL-7B-Instruct
  adapter: qwen_layer_probe
  dtype: bfloat16
  device_map: auto
  layers: [4, 8, 12, 16, 20, 24, -1]
router:
  id: OpenMed/Qwen2.5-3B-MedVL
  adapter: qwen_medical_router
  abstain_entropy: 0.95
broad_specialist:
  id: OpenMed/Qwen2.5-3B-MedVL
  adapter: qwen_layer_probe
  layers: [-1]
experts:
  cxr:
    id: StanfordAIMI/CheXagent-2-3b
    adapter: generative_chexagent
    capabilities: [classification, generation]
  pathology:
    id: MahmoodLab/CONCH
    adapter: contrastive_conch
    capabilities: [classification, retrieval]
  oct:
    id: QIAIUNCC/LO-VLM
    adapter: generative_blip
    capabilities: [classification, generation]
validators:
  cxr:
    id: microsoft/rad-dino
    adapter: visual_patch
method:
  correction_strength: 0.8
  agreement_temperature: 0.15
  erasure_floor: 0.05
  max_correction_norm: 1.25
  reliability_prior: 4.0
  reliability_lcb_z: 1.0
med_defer:
  granularity: clinical_claim
  execution: sparse
  controller:
    uncertainty_threshold: 0.35
    minimum_utility: 0.08
    cost_weight: 0.05
  domain_trust:
    cvar_alpha: 0.25
    ood_temperature: 2.0
    minimum_post_call_trust: 0.05
  guidance:
    strength: 0.8
    max_bias_norm: 1.25
protocol:
  source_only: true
  split: leave_one_domain_out
  target_labels_visible_during_fit: false
  cache_evidence: true
