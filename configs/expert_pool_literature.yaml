# Literature-grounded expert-pool roadmap for MERIT-Tx.
# Inclusion in this file is not commit authority. Runtime authority requires a
# source-only qualification card and a claim-compatible interface.

selection_principles:
  - capability_complementarity
  - modality_scope
  - claim_verifiability
  - independent_failure_group
  - public_or_auditable_weights
  - source_only_qualification_before_commit
  - no_target_test_selection

models:
  torchxrayvision:
    status: integrated
    role: direct_visual_verifier
    modalities: [cxr]
    capabilities: [classification, segmentation]
    evidence:
      - "MedRAX, ICML 2025"
      - "VILA-M3, CVPR 2025"
    rationale: Explicit CXR classification/segmentation tool family used by accepted medical-agent work.

  chexagent:
    status: integrated_proposal_only
    role: proposal_generator
    modalities: [cxr]
    capabilities: [generation]
    evidence:
      - "MedRAX, ICML 2025"
    rationale: Strong CXR specialist but generated text is not independent verification, so no direct commit authority.

  medsam:
    status: transaction_only
    role: spatial_localizer
    modalities: [cxr, xray, ct, mri, pathology, ultrasound, oct, fundus, dermatology, endoscopy]
    capabilities: [segmentation]
    evidence:
      - "Segment anything in medical images, Nature Communications 2024"
    weights: wanglab/medsam-vit-base
    rationale: Broad promptable segmentation across ten medical imaging modalities; requires an independently supplied ROI.

  conch:
    status: transaction_only
    role: direct_visual_verifier
    modalities: [pathology]
    capabilities: [classification, retrieval]
    evidence:
      - "CONCH, Nature Medicine 2024"
    weights: MahmoodLab/CONCH
    rationale: Pathology image-text model with zero-shot classification and cross-modal retrieval; use candidate-specific propositions, not a fixed tissue catalog.

  plip:
    status: transaction_only
    role: direct_visual_verifier
    modalities: [pathology]
    capabilities: [classification, retrieval]
    evidence:
      - "PLIP, Nature Medicine 2023"
    weights: vinid/plip
    rationale: Independently trained pathology image-text model from OpenPath, providing a separate failure group from CONCH.

  biomedclip_claim_verifier:
    status: transaction_only
    role: direct_visual_verifier
    modalities: [cxr, xray, ct, mri, pathology, gross_pathology]
    capabilities: [classification]
    evidence:
      - "BiomedCLIP / PMC-15M biomedical image-text pretraining"
      - "MERIT-Tx requires source-only role qualification before commit"
    weights: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
    rationale: Reuses an already integrated frozen biomedical image-text model as a dynamic candidate-vs-incumbent claim scorer, primarily filling CT/MRI verification gaps. It is not trusted by default and fails closed without a source card.

  medsiglip:
    status: candidate_gated_transaction_only
    role: direct_visual_verifier
    modalities: [cxr, xray, ct, mri, pathology, dermatology, fundus, clinical_photo]
    capabilities: [classification, retrieval]
    evidence:
      - "MedSigLIP official medical image-text encoder/model card"
      - "SigLIP, ICCV 2023"
    weights: google/medsiglip-448
    rationale: Frozen broad medical image-text similarity across CXR, dermatology, ophthalmology, pathology and CT/MRI slices. Gated weights and Health AI terms require explicit access; source qualification is mandatory before any commit authority.

  medcpt:
    status: integrated_context_only
    role: knowledge_retriever
    modalities: [cxr, xray, ct, mri, pathology, gross_pathology, ultrasound, oct, fundus, dermatology, endoscopy]
    capabilities: [retrieval]
    evidence:
      - "MedCPT, EMNLP 2023"
    weights: ncbi/MedCPT-Query-Encoder
    rationale: Literature relevance is external knowledge, not patient-specific image evidence; never commits alone.

  maira2:
    status: candidate_gated
    role: spatial_localizer_and_report_proposer
    modalities: [cxr]
    capabilities: [grounding, generation]
    evidence:
      - "MAIRA-2 grounded report generation, Microsoft Research 2024"
      - "MedRAX, ICML 2025 uses MAIRA-2 for CXR phrase grounding"
    weights: microsoft/maira-2
    rationale: High-value CXR phrase grounding and report proposal; gated 7B model and custom runtime, so add only after a dedicated adapter/parity canary.

  vista3d:
    status: candidate
    role: spatial_localizer
    modalities: [ct]
    capabilities: [segmentation]
    evidence:
      - "VILA-M3, CVPR 2025"
    rationale: VILA-M3 model cards use VISTA3D for CT anatomy/tumor segmentation; requires 3D-volume support absent from current 2D manifests.

  retfound:
    status: candidate_source_image_retrieval
    role: ophthalmology_image_retriever
    modalities: [fundus, oct]
    capabilities: [retrieval]
    evidence:
      - "RETFound, Nature 2023"
    rationale: Public retinal foundation-model weights exist for fundus and OCT, but the pretrained encoder is not a direct text/claim verifier. Use only with a real source-image index and source-only qualification.

  panderm:
    status: candidate_requires_downstream_head
    role: dermatology_foundation_encoder
    modalities: [dermatology, clinical_photo]
    capabilities: [retrieval]
    evidence:
      - "PanDerm, Nature Medicine 2025"
    rationale: Strong multimodal dermatology representation, but the released pretrained backbone generally requires linear probing or fine-tuning for downstream diagnosis; do not invent a training-free diagnosis head.

  uni:
    status: candidate
    role: pathology_image_retriever
    modalities: [pathology]
    capabilities: [retrieval]
    evidence:
      - "UNI, Nature Medicine 2024"
    rationale: Strong pathology vision foundation model, but vision-only embeddings need a real source-image index rather than an invented text-verification head.

  virchow:
    status: candidate
    role: pathology_image_retriever
    modalities: [pathology]
    capabilities: [retrieval]
    evidence:
      - "Virchow, Nature Medicine 2024"
    rationale: Strong pathology foundation model; defer until a source-image retrieval protocol is frozen.
