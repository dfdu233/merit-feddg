name: plug-observe
on:
  push:
    branches: ['implementation/plug-observe-*']
  pull_request:
    paths:
      - 'merit_feddg/plug_*.py'
      - 'tests/test_plug_observe.py'
      - 'tests/test_plug_bindings.py'
      - 'configs/plug_observe*.yaml'
      - '.github/workflows/plug-observe.yml'
concurrency:
  group: plug-observe-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_plug_observe.py tests/test_plug_bindings.py tests/test_evidence_agent.py -q
      - run: python -m ruff check merit_feddg/plug_observe.py merit_feddg/plug_run.py tests/test_plug_observe.py tests/test_plug_bindings.py
      - run: python -m merit_feddg.plug_run --help
  full-cpu-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' 'transformers==4.57.1' 'pyarrow>=15,<24'
      - run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q
