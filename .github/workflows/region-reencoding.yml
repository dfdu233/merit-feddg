name: region-reencoding
on:
  push:
    branches: ['implementation/bitflip-region-reencoding-*']
  pull_request:
    paths:
      - 'merit_feddg/region_reencoding.py'
      - 'scripts/*region_reencoding.py'
      - 'tests/test_region_reencoding.py'
      - '.github/workflows/region-reencoding.yml'
permissions:
  contents: read
concurrency:
  group: region-reencoding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' 'transformers==4.57.1' 'pyarrow>=15,<24'
      - run: python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_region_reencoding.py -q
      - run: python -m ruff check merit_feddg/region_reencoding.py scripts/run_region_reencoding.py scripts/evaluate_region_reencoding.py tests/test_region_reencoding.py
      - run: python -m pytest -q
      - run: python scripts/run_region_reencoding.py --help
