name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m merit_feddg.cli simulate --config configs/smoke.yaml --output runs/ci

  open-generation-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "transformers==4.57.1" "pyarrow>=15,<24"
      - run: python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_open_generation.py tests/test_open_data.py
      - run: bash -n run_open.sh bootstrap.sh
