name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m merit_feddg.cli simulate --config configs/smoke.yaml --output runs/ci

  open-generation-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "transformers==4.57.1" "pyarrow>=15,<24"
      - run: python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_open_generation.py tests/test_open_data.py tests/test_capability_generation.py tests/test_capability_experts.py tests/test_capability_study.py tests/test_llava_generalist.py tests/test_multimodal_data.py tests/test_capability_v08.py tests/test_llava_entry.py tests/test_capability_setup.py tests/test_bard.py tests/test_medcpt_kb.py tests/test_huatuo_generalist.py tests/test_merit_tx.py tests/test_merit_tx_closed_loop.py tests/test_expert_portfolio.py tests/test_block_intervention.py
      - run: python scripts/prepare_medcpt_assets.py --help && python scripts/build_medcpt_kb.py --help && python scripts/import_medcpt_pubmed.py --help && python scripts/prepare_bard_expert_cache.py --help && python scripts/check_huatuo_spatial_backend.py --help && python scripts/fit_expert_qualification.py --help && python scripts/fit_expert_portfolio.py --help && python scripts/split_merit_tx_source.py --help && python scripts/prepare_expert_pool_assets.py --help && python scripts/audit_transactional_expert_pool.py --help && python scripts/audit_evidence_certificate_upgrade.py --help && python scripts/audit_merit_tx_failure.py --help && python scripts/build_merit_tx_source_observations.py --help && python scripts/run_merit_tx_source_canary.py --help && python scripts/build_merit_block_ablation_plan.py --help && python scripts/build_merit_block_controls.py --help && python scripts/run_merit_block.py --help
      - run: python -m ruff check .
      - run: bash -n run_open.sh run_capabilities.sh run_llava_med.sh bootstrap.sh
