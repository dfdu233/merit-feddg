name: pathology-pilot-cpu
on:
  pull_request:
  push:
jobs:
  pathology-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_pathology_quilt_pilot.py
      - name: Syntax and undefined-name checks (new files only)
        run: >-
          python -m ruff check --isolated --select E9,F63,F7,F82
          merit_feddg/pathology_pilot.py merit_feddg/experts/quilt_cached.py
          scripts/run_quilt_worker.py scripts/run_pathology_quilt_pilot.py
          scripts/evaluate_pathology_quilt_pilot.py scripts/audit_conch_native_parity.py
          tests/test_pathology_quilt_pilot.py
      - run: python scripts/run_pathology_quilt_pilot.py --help
      - run: python scripts/run_quilt_worker.py --help
