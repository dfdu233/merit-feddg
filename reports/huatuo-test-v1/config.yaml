generalist:
  backend: huatuo_vision
  id: FreedomIntelligence/HuatuoGPT-Vision-7B
  checkpoint_path: /home/dbw/models/HuatuoGPT-Vision-7B
  source_path: /home/dbw/HuatuoGPT-Vision
  vision_tower_path: ''
  dtype: bfloat16
  device_map: auto
  device: cuda
  deterministic_image_padding: true
  training_free_spatial: true
  spatial_max_records: 64
  generation:
    repetition_penalty: 1.2
    min_new_tokens: 1
prompt_suffix: Answer the original question briefly using only image-supported information.
  Give the requested name or finding, not a report, unless an explanation is explicitly
  requested.
routing:
  enabled: true
  override_dataset_modality: true
capability_generation:
  control_protocol: action_id
  max_new_tokens: 96
  block_tokens: 16
  max_calls: 3
  max_controller_calls: 4
  controller_tokens: 8
  max_evidence_chars: 1600
qualification:
  min_per_domain: 8
  min_domains: 2
  penalty: 1.645
evaluation:
  single_tools: true
  source_adaptive_audit: false
experts:
  conch_tissue:
    id: MahmoodLab/CONCH
    revision: f9ca9f877171a28ade80228fb195ac5d79003357
    adapter: conch
    modalities:
    - pathology
    tasks:
    - open_vqa
    capabilities:
    - classification
    scope: tissue_appearance
    prefix_invariant: true
    excluded_question_types:
    - count
    - measurement
    - location
    description: Compare microscopic histology against a fixed tissue-appearance catalog.
      No gross photographs, arbitrary diagnoses, cell counts or measurements.
    catalog:
    - name: glandular epithelium
      prompt: A histopathology image of glandular epithelial tissue.
    - name: squamous epithelium
      prompt: A histopathology image of squamous epithelial tissue.
    - name: connective tissue
      prompt: A histopathology image of connective tissue.
    - name: adipose tissue
      prompt: A histopathology image of adipose tissue.
    - name: smooth muscle
      prompt: A histopathology image of smooth muscle tissue.
    - name: skeletal muscle
      prompt: A histopathology image of skeletal muscle tissue.
    - name: lymphoid tissue
      prompt: A histopathology image of lymphoid tissue.
    - name: neural tissue
      prompt: A histopathology image of neural tissue.
    - name: blood vessels
      prompt: A histopathology image of blood vessels.
    - name: necrotic tissue
      prompt: A histopathology image of necrotic tissue.
  biomed_anatomy:
    id: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
    revision: 9f341de24bfb00180f1b847274256e9b65a3a32e
    adapter: contrastive_biomedclip
    modalities:
    - cxr
    - xray
    - ct
    - mri
    - gross_pathology
    tasks:
    - open_vqa
    capabilities:
    - classification
    scope: major_anatomy
    prefix_invariant: true
    question_types:
    - anatomy
    description: Compare this image against a non-exhaustive major-organ catalog.
      Only for organ identification, not disease diagnosis, location, counts or segmentation.
    catalog:
    - brain
    - lung
    - heart
    - liver
    - kidney
    - spleen
    - pancreas
    - stomach
    - intestine
    - thyroid
    - skin
    - bone
    - breast
    - uterus
    - testis
  medcpt_pubmed:
    id: ncbi/MedCPT-Query-Encoder
    fault_group: medcpt_pubmed
    checkpoint_path: artifacts/models/ncbi--MedCPT-Query-Encoder
    optional: true
    required_local_paths:
    - artifacts/models/ncbi--MedCPT-Cross-Encoder
    - artifacts/knowledge/medcpt-pubmed/manifest.json
    preparation_hint: python scripts/prepare_medcpt_assets.py --download-models --print-commands
    factory: merit_feddg.experts.medcpt_retriever:MedCPTRetrievalExpert
    factory_kwargs:
      expert_id: medcpt_pubmed
      scope: biomedical_literature
      kb_manifest: artifacts/knowledge/medcpt-pubmed/manifest.json
      cross_encoder_path: artifacts/models/ncbi--MedCPT-Cross-Encoder
      device: auto
      candidate_k: 32
      top_k: 3
      max_query_tokens: 64
      max_pair_tokens: 512
    modalities:
    - cxr
    - xray
    - ct
    - mri
    - pathology
    - gross_pathology
    - ultrasound
    - oct
    - fundus
    - dermatology
    - endoscopy
    - clinical_photo
    - diagram
    tasks:
    - open_vqa
    capabilities:
    - retrieval
    scope: biomedical_literature
    prefix_invariant: true
    description: Retrieve PubMed biomedical literature with MedCPT dense retrieval
      and optional cross-encoder reranking. Retrieved passages are general medical
      knowledge, not patient-specific image findings or diagnoses.
  source_cases:
    id: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
    revision: 9f341de24bfb00180f1b847274256e9b65a3a32e
    adapter: source_retrieval
    encoder_adapter: contrastive_biomedclip
    modalities:
    - pathology
    - gross_pathology
    - cxr
    - xray
    - ct
    - mri
    - ultrasound
    - oct
    - fundus
    - dermatology
    - endoscopy
    - clinical_photo
    - diagram
    tasks:
    - open_vqa
    capabilities:
    - retrieval
    scope: related_source_qa
    prefix_invariant: true
    top_k: 1
    question_weight: 0.5
    include_source_answers: true
    description: Retrieve one source case matched by image AND question, from another
      source domain and same image type. Its answer belongs only to that different
      image; this is an analogy, not proof about the current image.
  cxr_findings:
    id: xrv/densenet121-res224-all
    fault_group: torchxrayvision
    adapter: xrv_classification
    checkpoint_path: artifacts/models/xrv/nih-pc-chex-mimic_ch-google-openi-kaggle-densenet121-d121-tw-lr001-rot45-tr15-sc15-seed0-best.pt
    weights: densenet121-res224-all
    modalities:
    - cxr
    tasks:
    - open_vqa
    capabilities:
    - classification
    scope: cxr_findings
    prefix_invariant: true
    excluded_question_types:
    - count
    - measurement
    - anatomy
    - location
    description: Whole-chest-radiograph disease finding scores from a small chest
      X-ray classifier. Not calibrated probabilities, not CT/MRI and not lesion location.
    spatial_support: true
  cxr_anatomy:
    id: xrv/pspnet-chestxray
    fault_group: torchxrayvision
    adapter: xrv_anatomy
    checkpoint_path: artifacts/models/xrv/pspnet_chestxray_best_model_4.pth
    modalities:
    - cxr
    tasks:
    - open_vqa
    capabilities:
    - segmentation
    scope: thoracic_anatomy
    requires_region: false
    prefix_invariant: true
    question_types:
    - anatomy
    - location
    - measurement
    - appearance
    description: Segment lung and heart anatomy in a chest radiograph, return crop-aware
      masks and spatial measurements. No tumor detection, no physical size without
      image calibration.
  chexagent_description:
    id: StanfordAIMI/CheXagent-2-3b
    checkpoint_path: artifacts/models/StanfordAIMI--CheXagent-2-3b
    optional: true
    factory: merit_feddg.experts.native_chexagent:CheXagentCapabilityExpert
    factory_kwargs:
      expert_id: chexagent_description
      scope: cxr_description
      dtype: bfloat16
      device_map: cuda
      max_new_tokens: 64
    modalities:
    - cxr
    tasks:
    - open_vqa
    capabilities:
    - generation
    scope: cxr_description
    requires_region: false
    description: Ask an existing specialist chest X-ray VLM for a short visual description
      relevant to the question. Its generated observation can be wrong and is not
      a gold report.
  biomedparse_objects:
    id: microsoft/BiomedParse
    checkpoint_path: artifacts/models/BiomedParse/biomed_parse.pt
    optional: true
    adapter: biomedparse_v1
    factory: merit_feddg.experts.native_biomedparse:BiomedParseCapabilityExpert
    factory_kwargs:
      expert_id: biomedparse_objects
      scope: biomedical_objects
      source_path: upstream/BiomedParse-v1
      max_prompts: 8
      groups_by_modality:
        ct:
        - CT-Abdomen
        - CT-Chest
        - CT-Liver
        mri:
        - MRI-Abdomen
        - MRI-Cardiac
        - MRI-FLAIR-Brain
        - MRI-T1-Gd-Brain
        cxr:
        - X-Ray-Chest
        pathology:
        - Pathology
        fundus:
        - Fundus
        dermatology:
        - Dermoscopy
        endoscopy:
        - Endoscopy
        oct:
        - OCT
        ultrasound:
        - Ultrasound-Cardiac
      group_requirements:
        CT-Abdomen:
        - - abdomen
          - abdominal
          - kidney
          - renal
          - liver
          - hepatic
          - spleen
          - pancreas
          - bowel
        CT-Chest:
        - - chest
          - lung
          - pulmonary
          - thorax
          - thoracic
        CT-Liver:
        - - liver
          - hepatic
        MRI-Abdomen:
        - - abdomen
          - abdominal
          - kidney
          - renal
          - liver
          - hepatic
          - spleen
          - pancreas
        MRI-Cardiac:
        - - heart
          - cardiac
          - ventricle
          - ventricular
        MRI-FLAIR-Brain:
        - - flair
        MRI-T1-Gd-Brain:
        - - t1
        - - contrast
          - gadolinium
          - gd
        Ultrasound-Cardiac:
        - - heart
          - cardiac
          - ventricle
          - ventricular
          - echocardiogram
          - echocardiography
    modalities:
    - ct
    - mri
    - cxr
    - pathology
    - fundus
    - dermatology
    - endoscopy
    - oct
    - ultrasound
    tasks:
    - open_vqa
    capabilities:
    - segmentation
    scope: biomedical_objects
    prefix_invariant: true
    requires_region: false
    description: Frozen BiomedParse v1 prompted soft masks within its published object
      groups; unknown anatomy or sequence is rejected where required. Not automatic
      diagnosis or confirmed object presence.
prompt_contract: anchor-ce-v1
capability_value:
  generation:
    max_new_tokens: 1024
    block_tokens: 1024
    max_expert_calls: 6
    max_decisions: 6
    max_evidence_chars: 30000
    visual_views: 0
    evidence_style: semantic
    evidence_order: acquisition
    token_budgeted_evidence: true
    request_style: need
    request_scope_check: false
    retrieval_answer_context: false
    behavior_probe: 'off'
    uncertainty_from_probe: false
    semantic_spatial: false
    compact_native: true
    compact_columns: true
    vector_gate: 'off'
    native_entry_transport: false
    claim_attribute_filter: false
    claim_gate_max_checks: 2
    vector_gate_probe_tokens: 64
    spatial_weighting: equal
    vector_gate_min_gain: 1.0e-06
bard:
  fault_budget: 1
  aggregation: geometric_median
  median_iterations: 12
  median_tolerance: 1.0e-06
  single_expert_policy: baseline
  pair_policy: unanimous
  fault_probe_scale: 8.0
