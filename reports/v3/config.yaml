    evidence_role: direct_visual_verifier
    commit_authority: source_qualified
    fault_group: musk_pathology
    modalities:
    - pathology
    tasks:
    - open_vqa
    capabilities:
    - classification
    scope: pathology_claim_support
    prefix_invariant: true
    portfolio_cost_units: 1.25
    literature:
    - 'MUSK, Nature 2025: pathology vision-language model with zero-shot classification
