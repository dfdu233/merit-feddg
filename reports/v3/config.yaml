  checkpoint_path: /home/dbw/ANCHOR/hf_cache/llava-med-v1.5-mistral-7b
  source_path: /home/dbw/ANCHOR/data/medheval/code/baselines/Med-LVLMs/llava-med-1.5
  vision_tower_path: /home/dbw/ANCHOR/hf_cache/hub/models--openai--clip-vit-large-patch14-336/snapshots/ce19dc912ca5cd21c8a653c79e251e808ccabcd1
  dtype: float16
  device_map: auto
  deterministic_image_padding: true
