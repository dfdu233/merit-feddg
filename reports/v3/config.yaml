  Give the requested name or finding, not a report, unless an explanation is explicitly
  requested.
routing:
  enabled: true
  override_dataset_modality: true
capability_generation:
  control_protocol: action_id
  max_new_tokens: 96
  block_tokens: 16
  max_calls: 3
  max_controller_calls: 4
  controller_tokens: 8
  max_evidence_chars: 1600
qualification:
  min_per_domain: 8
  min_domains: 2
  penalty: 1.645
evaluation:
  single_tools: true
  source_adaptive_audit: false
experts:
  conch_tissue:
    id: MahmoodLab/CONCH
    revision: f9ca9f877171a28ade80228fb195ac5d79003357
    adapter: conch
    modalities:
    - pathology
    tasks:
    - open_vqa
    capabilities:
    - classification
    scope: tissue_appearance
    prefix_invariant: true
    excluded_question_types:
    - count
    - measurement
    - location
    description: Compare microscopic histology against a fixed tissue-appearance catalog.
      No gross photographs, arbitrary diagnoses, cell counts or measurements.
    catalog:
    - name: glandular epithelium
      prompt: A histopathology image of glandular epithelial tissue.
    - name: squamous epithelium
      prompt: A histopathology image of squamous epithelial tissue.
    - name: connective tissue
      prompt: A histopathology image of connective tissue.
    - name: adipose tissue
      prompt: A histopathology image of adipose tissue.
    - name: smooth muscle
      prompt: A histopathology image of smooth muscle tissue.
    - name: skeletal muscle
      prompt: A histopathology image of skeletal muscle tissue.
    - name: lymphoid tissue
      prompt: A histopathology image of lymphoid tissue.
    - name: neural tissue
      prompt: A histopathology image of neural tissue.
    - name: blood vessels
      prompt: A histopathology image of blood vessels.
    - name: necrotic tissue
      prompt: A histopathology image of necrotic tissue.
    enabled: false
    expert_pool_enabled: false
    deprecation_reason: fixed ten-class tissue catalog is not a claim-aligned pathology
      verifier
    fault_group: conch_pathology
  conch_claim_verifier:
    id: MahmoodLab/CONCH
    revision: f9ca9f877171a28ade80228fb195ac5d79003357
    adapter: contrastive_conch
    transaction_only: true
    optional: true
    evidence_role: direct_visual_verifier
    commit_authority: source_qualified
    fault_group: conch_pathology
    modalities:
    - pathology
    tasks:
    - open_vqa
    capabilities:
    - classification
    scope: pathology_claim_support
    prefix_invariant: true
    literature:
    - 'CONCH, Nature Medicine 2024: zero-shot pathology classification and image-text
      retrieval'
    description: Claim-conditioned pathology image-text verification. Candidate propositions
      come from the immutable baseline/proposal stage; CONCH similarity is not a diagnosis
      probability.
  plip_claim_verifier:
    id: vinid/plip
    checkpoint_path: artifacts/models/vinid--plip
    adapter: contrastive_plip
    transaction_only: true
    optional: true
    preparation_hint: python scripts/prepare_expert_pool_assets.py --download-open
    evidence_role: direct_visual_verifier
    commit_authority: source_qualified
    fault_group: plip_pathology
    modalities:
    - pathology
    tasks:
    - open_vqa
    capabilities:
    - classification
    scope: pathology_claim_support
    prefix_invariant: true
    literature:
    - 'PLIP, Nature Medicine 2023: pathology zero-shot classification and image-text
      retrieval'
    description: Independent pathology image-text verifier trained from OpenPath.
      Used only for candidate-specific claim scoring and never as an unqualified vote.
  musk_claim_verifier:
    id: xiangjx/musk
    checkpoint_path: artifacts/models/xiangjx--musk
